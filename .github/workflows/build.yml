name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download and Setup Gradle 8.0
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Create Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/teacherhelper
        mkdir -p app/src/main/res/layout

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "TeacherHelper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.teacherhelper'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.teacherhelper"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="TeacherHelper" android:theme="@android:style/Theme.DeviceDefault">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:padding="20dp">

            <!-- ЭКРАН ВХОДА -->
            <LinearLayout
                android:id="@+id/layoutActivation"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:gravity="center">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Введите код активации:"
                    android:textSize="20sp"
                    android:layout_marginBottom="20dp"/>

                <EditText
                    android:id="@+id/codeInput"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Например: 123"
                    android:inputType="text"
                    android:layout_marginBottom="20dp"/>

                <Button
                    android:id="@+id/btnLogin"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Войти" />
            </LinearLayout>

            <!-- ГЛАВНЫЙ ЭКРАН -->
            <LinearLayout
                android:id="@+id/layoutMain"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:visibility="gone">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Мои протоколы:"
                    android:textSize="22sp"
                    android:layout_marginBottom="10dp"/>

                <Button
                    android:id="@+id/btnAddTeacher"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="+ Создать протокол учителя"
                    android:layout_marginBottom="15dp"/>

                <ScrollView
                    android:layout_width="match_parent"
                    android:layout_height="0dp"
                    android:layout_weight="1">
                    <LinearLayout
                        android:id="@+id/teachersContainer"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical" />
                </ScrollView>
            </LinearLayout>
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/teacherhelper/MainActivity.java
        package com.example.teacherhelper;
        import android.app.Activity;
        import android.app.AlertDialog;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.widget.Toast;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                LinearLayout layoutActivation = findViewById(R.id.layoutActivation);
                LinearLayout layoutMain = findViewById(R.id.layoutMain);
                EditText codeInput = findViewById(R.id.codeInput);
                Button btnLogin = findViewById(R.id.btnLogin);
                Button btnAddTeacher = findViewById(R.id.btnAddTeacher);
                LinearLayout teachersContainer = findViewById(R.id.teachersContainer);

                btnLogin.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (codeInput.getText().toString().equals("123")) {
                            layoutActivation.setVisibility(View.GONE);
                            layoutMain.setVisibility(View.VISIBLE);
                        } else {
                            Toast.makeText(MainActivity.this, "Неверный код", Toast.LENGTH_SHORT).show();
                        }
                    }
                });

                btnAddTeacher.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        AlertDialog.Builder builder = new AlertDialog.Builder(MainActivity.this);
                        builder.setTitle("Имя учителя");

                        final EditText input = new EditText(MainActivity.this);
                        builder.setView(input);

                        builder.setPositiveButton("Сохранить", (dialog, which) -> {
                            String name = input.getText().toString();
                            if (!name.isEmpty()) {
                                TextView tv = new TextView(MainActivity.this);
                                tv.setText("📁 " + name);
                                tv.setTextSize(18);
                                tv.setPadding(0, 25, 0, 25);
                                teachersContainer.addView(tv);
                            }
                        });
                        builder.setNegativeButton("Отмена", (dialog, which) -> dialog.cancel());
                        builder.show();
                    }
                });
            }
        }
        EOF

        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TeacherHelper-APK
        path: app/build/outputs/apk/debug/app-debug.apk
