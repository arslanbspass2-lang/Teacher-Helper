name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download and Setup Gradle 8.1.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        echo "$PWD/gradle-8.1.1/bin" >> $GITHUB_PATH

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Write settings.gradle
      run: |
        cat > settings.gradle <<'GRADLE'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "TeacherHelper"
        include ':app'
        GRADLE

    - name: Write root build.gradle
      run: |
        cat > build.gradle <<'GRADLE'
        plugins {
            id 'com.android.application' version '8.1.4' apply false
        }
        GRADLE

    - name: Write gradle.properties
      run: |
        cat > gradle.properties <<'PROPS'
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        PROPS

    - name: Write app/build.gradle
      run: |
        mkdir -p app
        cat > app/build.gradle <<'GRADLE'
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.teacherhelper'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.teacherhelper"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "2.0-chat"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.room:room-runtime:2.6.1'
            annotationProcessor 'androidx.room:room-compiler:2.6.1'
            implementation 'androidx.documentfile:documentfile:1.0.1'
            implementation 'androidx.core:core:1.12.0'
        }
        GRADLE

    - name: Write manifest
      run: |
        mkdir -p app/src/main
        cat > app/src/main/AndroidManifest.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="TeacherHelper"
                android:theme="@style/Theme.TeacherHelper"
                android:allowBackup="false"
                android:windowSoftInputMode="adjustResize">
                <activity android:name=".MainActivity" 
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        XML

    - name: Write themes
      run: |
        mkdir -p app/src/main/res/values
        cat > app/src/main/res/values/themes.xml <<'XML'
        <resources>
            <style name="Theme.TeacherHelper" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowLayoutInDisplayCutoutMode">always</item>
                <item name="android:statusBarColor">@android:color/transparent</item>
                <item name="android:navigationBarColor">@android:color/transparent</item>
                <item name="android:windowBackground">@android:color/white</item>
                <item name="android:enforceStatusBarContrast">false</item>
                <item name="android:enforceNavigationBarContrast">false</item>
            </style>
        </resources>
        XML

    - name: Write activity_main layout (ЧАТ)
      run: |
        mkdir -p app/src/main/res/layout
        cat > app/src/main/res/layout/activity_main.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#FFFFFF">

            <!-- Экран активации -->
            <LinearLayout
                android:id="@+id/layoutActivation"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:padding="16dp"
                android:gravity="center">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Введите код активации:"
                    android:textSize="20sp"
                    android:layout_marginBottom="16dp"/>
                <EditText
                    android:id="@+id/codeInput"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Код из бота"
                    android:inputType="text"
                    android:layout_marginBottom="16dp"/>
                <Button
                    android:id="@+id/btnLogin"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Активировать"/>
            </LinearLayout>

            <!-- Главный экран (ЧАТ) -->
            <LinearLayout
                android:id="@+id/layoutMain"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:orientation="vertical"
                android:visibility="gone">

                <!-- Верхняя панель с кнопками -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:padding="8dp"
                    android:background="#F0F0F0"
                    android:gravity="center_vertical">

                    <Button
                        android:id="@+id/btnTeachers"
                        android:layout_width="0dp"
                        android:layout_height="40dp"
                        android:layout_weight="1"
                        android:text="Учителя"
                        android:textSize="12sp"
                        android:layout_marginEnd="4dp"/>
                    <Button
                        android:id="@+id/btnBooks"
                        android:layout_width="0dp"
                        android:layout_height="40dp"
                        android:layout_weight="1"
                        android:text="Учебники"
                        android:textSize="12sp"
                        android:layout_marginEnd="4dp"/>
                    <Button
                        android:id="@+id/btnLoadBook"
                        android:layout_width="0dp"
                        android:layout_height="40dp"
                        android:layout_weight="1"
                        android:text="+ PDF"
                        android:textSize="12sp"/>
                </LinearLayout>

                <!-- Окно чата -->
                <ScrollView
                    android:id="@+id/chatScroll"
                    android:layout_width="match_parent"
                    android:layout_height="0dp"
                    android:layout_weight="1"
                    android:padding="8dp">
                    <LinearLayout
                        android:id="@+id/chatContainer"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"/>
                </ScrollView>

                <!-- Нижняя панель: поле ввода и кнопки -->
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:padding="8dp"
                    android:background="#F0F0F0"
                    android:gravity="center_vertical">

                    <Button
                        android:id="@+id/btnSOS"
                        android:layout_width="50dp"
                        android:layout_height="50dp"
                        android:text="SOS"
                        android:backgroundTint="#D32F2F"
                        android:textColor="#FFFFFF"
                        android:textSize="10sp"
                        android:layout_marginEnd="8dp"/>

                    <EditText
                        android:id="@+id/inputMessage"
                        android:layout_width="0dp"
                        android:layout_height="wrap_content"
                        android:layout_weight="1"
                        android:hint="Задайте вопрос..."
                        android:inputType="textMultiLine"
                        android:maxLines="3"
                        android:background="@android:drawable/editbox_background"
                        android:padding="10dp"
                        android:layout_marginEnd="8dp"/>

                    <Button
                        android:id="@+id/btnSend"
                        android:layout_width="wrap_content"
                        android:layout_height="50dp"
                        android:text="Отправить"
                        android:backgroundTint="#4CAF50"
                        android:textColor="#FFFFFF"
                        android:textSize="12sp"/>
                </LinearLayout>
            </LinearLayout>

            <ImageView
                android:id="@+id/panicScreen"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:scaleType="centerCrop"
                android:background="#000000"
                android:visibility="gone"
                android:clickable="true"
                android:focusable="true"/>
        </LinearLayout>
        XML

    - name: Write chat item layout (сообщение)
      run: |
        cat > app/src/main/res/layout/item_chat.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="10dp"
            android:layout_marginBottom="8dp"
            android:background="#E0E0E0">
            <TextView
                android:id="@+id/tvMessage"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textSize="16sp"/>
        </LinearLayout>
        XML

    - name: Write item_teacher layout
      run: |
        cat > app/src/main/res/layout/item_teacher.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="10dp"
            android:layout_marginBottom="6dp"
            android:background="#EEEEEE">
            <TextView
                android:id="@+id/tvName"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textSize="18sp"
                android:textStyle="bold"/>
            <TextView
                android:id="@+id/tvRules"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textSize="14sp"
                android:layout_marginTop="4dp"/>
            <Button
                android:id="@+id/btnAddRule"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="+ Правило"
                android:layout_marginTop="6dp"/>
        </LinearLayout>
        XML

    - name: Write Teacher.java
      run: |
        mkdir -p app/src/main/java/com/example/teacherhelper/db
        cat > app/src/main/java/com/example/teacherhelper/db/Teacher.java <<'JAVA'
        package com.example.teacherhelper.db;

        import androidx.room.Entity;
        import androidx.room.PrimaryKey;

        @Entity(tableName = "teachers")
        public class Teacher {
            @PrimaryKey(autoGenerate = true) public int id;
            public String name;
            public String rules;

            public Teacher(String name, String rules) {
                this.name = name;
                this.rules = rules;
            }
        }
        JAVA

    - name: Write Book.java
      run: |
        cat > app/src/main/java/com/example/teacherhelper/db/Book.java <<'JAVA'
        package com.example.teacherhelper.db;

        import androidx.room.Entity;
        import androidx.room.PrimaryKey;

        @Entity(tableName = "books")
        public class Book {
            @PrimaryKey(autoGenerate = true) public int id;
            public String title;
            public String uri;

            public Book(String title, String uri) {
                this.title = title;
                this.uri = uri;
            }
        }
        JAVA

    - name: Write AppDao.java
      run: |
        cat > app/src/main/java/com/example/teacherhelper/db/AppDao.java <<'JAVA'
        package com.example.teacherhelper.db;

        import androidx.room.Dao;
        import androidx.room.Insert;
        import androidx.room.Query;
        import androidx.room.Update;
        import androidx.room.Delete;

        import java.util.List;

        @Dao
        public interface AppDao {
            @Query("SELECT * FROM teachers ORDER BY id DESC")
            List<Teacher> getAllTeachers();

            @Insert
            long insertTeacher(Teacher t);

            @Update
            void updateTeacher(Teacher t);

            @Query("SELECT * FROM books ORDER BY id DESC")
            List<Book> getAllBooks();

            @Insert
            long insertBook(Book b);

            @Delete
            void deleteBook(Book b);
        }
        JAVA

    - name: Write AppDatabase.java
      run: |
        cat > app/src/main/java/com/example/teacherhelper/db/AppDatabase.java <<'JAVA'
        package com.example.teacherhelper.db;

        import android.content.Context;
        import androidx.room.Database;
        import androidx.room.Room;
        import androidx.room.RoomDatabase;

        @Database(entities = {Teacher.class, Book.class}, version = 1, exportSchema = false)
        public abstract class AppDatabase extends RoomDatabase {
            private static volatile AppDatabase INSTANCE;

            public abstract AppDao dao();

            public static AppDatabase get(Context ctx) {
                if (INSTANCE == null) {
                    synchronized (AppDatabase.class) {
                        if (INSTANCE == null) {
                            INSTANCE = Room.databaseBuilder(
                                    ctx.getApplicationContext(),
                                    AppDatabase.class,
                                    "teacher_helper.db")
                                .allowMainThreadQueries()
                                .build();
                        }
                    }
                }
                return INSTANCE;
            }
        }
        JAVA

    - name: Write MainActivity.java
      run: |
        mkdir -p app/src/main/java/com/example/teacherhelper
        cat > app/src/main/java/com/example/teacherhelper/MainActivity.java <<'JAVA'
        package com.example.teacherhelper;

        import android.app.Activity;
        import android.app.AlertDialog;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.GestureDetector;
        import android.view.MotionEvent;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.ImageView;
        import android.widget.LinearLayout;
        import android.widget.ScrollView;
        import android.widget.TextView;
        import android.widget.Toast;

        import androidx.activity.result.ActivityResultLauncher;
        import androidx.activity.result.contract.ActivityResultContracts;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.view.WindowCompat;
        import androidx.core.view.WindowInsetsCompat;
        import androidx.core.view.WindowInsetsControllerCompat;

        import com.example.teacherhelper.db.AppDatabase;
        import com.example.teacherhelper.db.Book;
        import com.example.teacherhelper.db.Teacher;

        import org.json.JSONArray;

        import java.util.List;
        import java.util.regex.Matcher;
        import java.util.regex.Pattern;

        public class MainActivity extends AppCompatActivity {

            private static final String[] VALID_CODES = {"BETA2025", "TEST123", "123"};

            private AppDatabase db;
            private ActivityResultLauncher<Intent> bookPicker;
            private LinearLayout chatContainer;
            private ScrollView chatScroll;
            private ImageView panicScreen;
            private Button btnSOS;
            private float defaultBrightness = 0.5f;
            private GestureDetector gestureDetector;

            private String activeTeacher = "Без учителя";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                    getWindow().getAttributes().layoutInDisplayCutoutMode =
                            WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                }
                
                setContentView(R.layout.activity_main);
                db = AppDatabase.get(this);

                LinearLayout layoutActivation = findViewById(R.id.layoutActivation);
                LinearLayout layoutMain = findViewById(R.id.layoutMain);
                EditText codeInput = findViewById(R.id.codeInput);
                Button btnLogin = findViewById(R.id.btnLogin);
                Button btnTeachers = findViewById(R.id.btnTeachers);
                Button btnBooks = findViewById(R.id.btnBooks);
                Button btnLoadBook = findViewById(R.id.btnLoadBook);
                Button btnSend = findViewById(R.id.btnSend);
                EditText inputMessage = findViewById(R.id.inputMessage);
                btnSOS = findViewById(R.id.btnSOS);
                chatContainer = findViewById(R.id.chatContainer);
                chatScroll = findViewById(R.id.chatScroll);
                panicScreen = findViewById(R.id.panicScreen);

                // Восстанавливаем яркость при старте
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                getWindow().setAttributes(lp);

                gestureDetector = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                    @Override
                    public boolean onDoubleTap(MotionEvent e) {
                        restoreBrightness();
                        panicScreen.setVisibility(View.GONE);
                        btnSOS.setVisibility(View.VISIBLE);
                        return true;
                    }
                });

                panicScreen.setOnTouchListener((v, event) -> {
                    gestureDetector.onTouchEvent(event);
                    return true;
                });

                btnSOS.setOnClickListener(v -> {
                    try {
                        WindowManager.LayoutParams lp2 = getWindow().getAttributes();
                        lp2.screenBrightness = 0.01f;
                        getWindow().setAttributes(lp2);
                        
                        panicScreen.setVisibility(View.VISIBLE);
                        btnSOS.setVisibility(View.GONE);
                        
                        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                        if (controller != null) {
                            controller.hide(WindowInsetsCompat.Type.systemBars());
                        }
                    } catch (Exception e) {
                        panicScreen.setVisibility(View.VISIBLE);
                        btnSOS.setVisibility(View.GONE);
                    }
                });

                bookPicker = registerForActivityResult(
                        new ActivityResultContracts.StartActivityForResult(),
                        result -> {
                            if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                                Uri uri = result.getData().getData();
                                if (uri != null) {
                                    getContentResolver().takePersistableUriPermission(
                                            uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                    String title = uri.getLastPathSegment();
                                    db.dao().insertBook(new Book(title == null ? "book" : title, uri.toString()));
                                    Toast.makeText(this, "Учебник добавлен", Toast.LENGTH_SHORT).show();
                                }
                            }
                        });

                if (isActivated()) {
                    layoutActivation.setVisibility(View.GONE);
                    layoutMain.setVisibility(View.VISIBLE);
                    addMessageToChat("Привет! Я твой умный помощник. Выбери учителя сверху, чтобы я учитывал его правила.", false);
                }

                btnLogin.setOnClickListener(v -> {
                    String code = codeInput.getText().toString().trim();
                    if (isValidCode(code)) {
                        getSharedPreferences("activation", MODE_PRIVATE)
                                .edit().putString("code", code).apply();
                        layoutActivation.setVisibility(View.GONE);
                        layoutMain.setVisibility(View.VISIBLE);
                        addMessageToChat("Привет! Я твой умный помощник. Выбери учителя сверху, чтобы я учитывал его правила.", false);
                    } else {
                        Toast.makeText(this, "Неверный код", Toast.LENGTH_LONG).show();
                    }
                });

                // Кнопка "Учителя" - список и создание
                btnTeachers.setOnClickListener(v -> showTeachersDialog());

                // Кнопка "Учебники" - список
                btnBooks.setOnClickListener(v -> showBooksList());

                // Кнопка "Загрузить PDF"
                btnLoadBook.setOnClickListener(v -> {
                    Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType("application/pdf");
                    bookPicker.launch(i);
                });

                // Кнопка "Отправить"
                btnSend.setOnClickListener(v -> {
                    String question = inputMessage.getText().toString().trim();
                    if (question.isEmpty()) return;
                    
                    addMessageToChat("Вы: " + question, true);
                    inputMessage.setText("");
                    
                    String answer = processQuestion(question, activeTeacher);
                    addMessageToChat("ИИ: " + answer, false);
                });
            }

            private void addMessageToChat(String text, boolean isUser) {
                View messageView = getLayoutInflater().inflate(R.layout.item_chat, chatContainer, false);
                TextView tvMessage = messageView.findViewById(R.id.tvMessage);
                tvMessage.setText(text);
                
                if (isUser) {
                    messageView.setBackgroundColor(0xFFDCF8C6); // Светло-зеленый для пользователя
                    LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                            LinearLayout.LayoutParams.WRAP_CONTENT,
                            LinearLayout.LayoutParams.WRAP_CONTENT);
                    params.gravity = android.view.Gravity.END;
                    messageView.setLayoutParams(params);
                } else {
                    messageView.setBackgroundColor(0xFFE0E0E0);
                }
                
                chatContainer.addView(messageView);
                
                // Прокручиваем чат вниз
                chatScroll.post(() -> chatScroll.fullScroll(View.FOCUS_DOWN));
            }

            private void showTeachersDialog() {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Выберите учителя или создайте нового");

                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(16, 16, 16, 16);

                List<Teacher> teachers = db.dao().getAllTeachers();
                String[] names = new String[teachers.size()];
                for (int i = 0; i < teachers.size(); i++) {
                    names[i] = teachers.get(i).name;
                }

                builder.setItems(names, (dialog, which) -> {
                    activeTeacher = teachers.get(which).name;
                    addMessageToChat("Выбран учитель: " + activeTeacher + ". Теперь я буду учитывать его правила.", false);
                });

                builder.setPositiveButton("+ Создать нового", (d, w) -> {
                    AlertDialog.Builder b2 = new AlertDialog.Builder(this);
                    b2.setTitle("Имя учителя");
                    final EditText input = new EditText(this);
                    b2.setView(input);
                    b2.setPositiveButton("Сохранить", (d2, w2) -> {
                        String name = input.getText().toString().trim();
                        if (!name.isEmpty()) {
                            db.dao().insertTeacher(new Teacher(name, "[]"));
                            activeTeacher = name;
                            addMessageToChat("Создан протокол: " + name + ". Вы можете добавить правила через меню учителей.", false);
                        }
                    });
                    b2.setNegativeButton("Отмена", (d2, w2) -> d2.cancel());
                    b2.show();
                });
                
                builder.setNeutralButton("Добавить правило", (d, w) -> {
                    AlertDialog.Builder b3 = new AlertDialog.Builder(this);
                    b3.setTitle("Введите правило для " + activeTeacher);
                    final EditText input = new EditText(this);
                    b3.setView(input);
                    b3.setPositiveButton("Сохранить", (d3, w3) -> {
                        String rule = input.getText().toString().trim();
                        if (rule.isEmpty()) return;
                        List<Teacher> all = db.dao().getAllTeachers();
                        for (Teacher t : all) {
                            if (t.name.equals(activeTeacher)) {
                                try {
                                    JSONArray arr = new JSONArray(t.rules);
                                    arr.put(rule);
                                    t.rules = arr.toString();
                                    db.dao().updateTeacher(t);
                                    addMessageToChat("Добавлено правило: " + rule, false);
                                } catch (Exception e) {}
                            }
                        }
                    });
                    b3.setNegativeButton("Отмена", (d3, w3) -> d3.cancel());
                    b3.show();
                });

                builder.setNegativeButton("Закрыть", (d, w) -> d.dismiss());
                builder.show();
            }

            private String processQuestion(String question, String teacherName) {
                StringBuilder sb = new StringBuilder();
                
                List<Teacher> teachers = db.dao().getAllTeachers();
                String teacherRule = "";
                for (Teacher t : teachers) {
                    if (t.name.equalsIgnoreCase(teacherName)) {
                        try {
                            JSONArray arr = new JSONArray(t.rules);
                            for (int i = 0; i < arr.length(); i++) {
                                teacherRule += arr.getString(i) + " ";
                            }
                        } catch (Exception e) {}
                    }
                }

                String cleanTask = question.replace(" ", "").replace("=0", "").replace("X", "x");
                Pattern pattern = Pattern.compile("([-+]?\\d*)x\\^2([-+]?\\d*)x([-+]?\\d+)");
                Matcher matcher = pattern.matcher(cleanTask);
                
                if (matcher.find()) {
                    try {
                        String aStr = matcher.group(1).replace("+", "");
                        String bStr = matcher.group(2).replace("+", "");
                        String cStr = matcher.group(3).replace("+", "");
                        
                        double a = aStr.isEmpty() || aStr.equals("-") ? (aStr.equals("-") ? -1 : 1) : Double.parseDouble(aStr);
                        double b = bStr.isEmpty() || bStr.equals("-") ? (bStr.equals("-") ? -1 : 1) : Double.parseDouble(bStr);
                        double c = cStr.isEmpty() ? 0 : Double.parseDouble(cStr);

                        double D = b * b - 4 * a * c;
                        
                        sb.append("✅ Это квадратное уравнение.\n");
                        sb.append("a = ").append(a).append(", b = ").append(b).append(", c = ").append(c).append("\n\n");

                        if (teacherRule.toLowerCase().contains("виета")) {
                            sb.append("🎯 Решаем через теорему Виета (по правилу учителя):\n");
                            sb.append("Сумма корней = ").append(-b/a).append("\n");
                            sb.append("Произведение = ").append(c/a).append("\n");
                            sb.append("Ответ: x1 = ").append((-b + Math.sqrt(D)) / (2 * a)).append(", x2 = ").append((-b - Math.sqrt(D)) / (2 * a));
                        } else {
                            sb.append("🎯 Решаем через дискриминант:\n");
                            sb.append("D = ").append(D).append("\n");
                            if (D > 0) {
                                sb.append("x1 = ").append((-b + Math.sqrt(D)) / (2 * a)).append("\n");
                                sb.append("x2 = ").append((-b - Math.sqrt(D)) / (2 * a)).append("\n");
                                sb.append("Ответ: x1 = ").append((-b + Math.sqrt(D)) / (2 * a)).append(", x2 = ").append((-b - Math.sqrt(D)) / (2 * a));
                            } else if (D == 0) {
                                sb.append("Ответ: x = ").append(-b / (2 * a));
                            } else {
                                sb.append("Ответ: Корней нет (D < 0).");
                            }
                        }
                    } catch (Exception e) {
                        sb.append("Не удалось распознать уравнение. Пишите в формате: x^2 - 5x + 6 = 0");
                    }
                } else {
                    sb.append("🔍 Это не уравнение. Ищу ответ в правилах...\n\n");
                    
                    if (teacherRule.isEmpty()) {
                        sb.append("❌ У этого учителя пока нет правил.\n");
                        sb.append("Добавьте правило через кнопку 'Учителя' сверху!");
                    } else {
                        String[] words = question.toLowerCase().split(" ");
                        boolean found = false;
                        String matchedRule = "";
                        
                        for (String word : words) {
                            if (word.length() > 3 && teacherRule.toLowerCase().contains(word)) {
                                found = true;
                                matchedRule = teacherRule;
                                break;
                            }
                        }
                        
                        if (found) {
                            sb.append("📖 Найдено в протоколе учителя:\n");
                            sb.append("👉 ").append(matchedRule.trim()).append("\n\n");
                            
                            if (question.toLowerCase().contains("онегин") || question.toLowerCase().contains("пушкин")) {
                                sb.append("💡 Совет: В учебнике литературы найдите главу про Евгения Онегина.");
                            } else if (question.toLowerCase().contains("война") || question.toLowerCase().contains("1812")) {
                                sb.append("💡 Совет: В учебнике истории найдите раздел про Отечественную войну 1812 года.");
                            } else {
                                sb.append("💡 Совет: Откройте учебник по этому предмету и найдите нужную тему.");
                            }
                        } else {
                            sb.append("❌ В правилах учителя нет ответа на этот вопрос.\n");
                            sb.append("💡 Рекомендация: Откройте учебник по этому предмету.");
                        }
                    }
                }
                
                return sb.toString();
            }

            private void restoreBrightness() {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                getWindow().setAttributes(lp);
            }

            private boolean isValidCode(String code) {
                for (String c : VALID_CODES) {
                    if (c.equals(code)) return true;
                }
                return false;
            }

            private boolean isActivated() {
                String code = getSharedPreferences("activation", MODE_PRIVATE)
                        .getString("code", null);
                return code != null && isValidCode(code);
            }

            private void showBooksList() {
                List<Book> books = db.dao().getAllBooks();
                if (books.isEmpty()) {
                    Toast.makeText(this, "Учебников нет", Toast.LENGTH_SHORT).show();
                    return;
                }

                String[] titles = new String[books.size()];
                for (int i = 0; i < books.size(); i++) {
                    titles[i] = books.get(i).title;
                }

                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("Выберите учебник");
                builder.setItems(titles, (dialog, which) -> {
                    Book selectedBook = books.get(which);
                    showBookOptions(selectedBook);
                });
                builder.show();
            }

            private void showBookOptions(Book book) {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle(book.title);
                String[] options = {"Открыть", "Удалить"};
                builder.setItems(options, (dialog, which) -> {
                    if (which == 0) {
                        try {
                            Intent intent = new Intent(Intent.ACTION_VIEW);
                            intent.setDataAndType(Uri.parse(book.uri), "application/pdf");
                            intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                            startActivity(intent);
                        } catch (Exception e) {
                            Toast.makeText(this, "На телефоне нет программы для чтения PDF", Toast.LENGTH_SHORT).show();
                        }
                    } else {
                        db.dao().deleteBook(book);
                        Toast.makeText(this, "Удалено", Toast.LENGTH_SHORT).show();
                    }
                });
                builder.show();
            }
        }
        JAVA

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon --stacktrace

    - name: Prepare APK for download
      if: always()
      run: |
        mkdir -p output
        find app/build/outputs -name "*.apk" -exec cp {} output/TeacherHelper.apk \;

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TeacherHelper
        path: output/TeacherHelper.apk
        if-no-files-found: warn

    - name: Show Download Link
      if: always()
      run: |
        echo "=================================================================="
        echo "ССЫЛКА НА СКАЧИВАНИЕ APK:"
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ github.run_id }}"
        echo "=================================================================="
